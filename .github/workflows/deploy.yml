name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ "main" ]

# Разрешения для работы с GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем текущие деплои, если запустился новый
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build project
        run: |
          cd frontend
          npm run build
          # Решение проблемы 404 для Vue Router (SPA) на GitHub Pages
          # Просто копируем index.html в 404.html
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем скомпилированные файлы из папки dist внутри frontend
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4